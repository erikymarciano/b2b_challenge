services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py makemigrations station &&
             python manage.py migrate &&
             python manage.py loaddata stations &&
             python manage.py runserver 0.0.0.0:8000"